# End-to-end demo: one video through the whole verifier, with its report and overlay.
# Ad-hoc prompts and given videos never touch the generator comparison campaign.

[demo]
adhoc_campaign = "demo_adhoc"            # under paths.data_dir/finetune and raw_dir/local_video
out_dir = "demo"                         # under paths.data_dir unless absolute
allow_provisional = true                 # fall back to the provisional rule, labelled as such
select_run = "main"                      # `finetune select` run of `scenes --from-select`

[demo.overlay]                           # pixels of a 480-pixel-high frame; scaled with height
font_scale = 0.5
bar_height = 26
badge_height = 20
badge_width = 190
margin = 6
reference_height = 480
