# Calibration chain. Fit on split=calib only; eval and real clips are held out
# and only scored by `calibrate evaluate`. k_sigma and couplings are read from [verification].
[calibration]
dataset = "kubric_synthetic"
subset = "full"
levels = ["oracle", "perceived"]
alpha = 0.05                 # target FPR per clean scene (L_C)
beta = 0.05                  # miss rate for L_D
folds = 5                    # grouped by scene
bootstrap = 2000
seed = 0
ci = 0.95
min_sigma_pairs = 10
sigma_pair_filter = "nonzero"  # per-check sigma recalibration over pairs with a nonzero side
platt_l2 = 0.01
ld_max_extrapolation = 1.0   # L_D beyond 2x the largest tested magnitude is censored
real_datasets = ["physics_iq", "pisa_real"]
artifact = "calibration.json"            # under paths.calibration_dir
stage_profile = "stage_errors.recalibrated.json"
# Consumers (human-agreement study, generator comparison, publish) score with a stratum that is
# usable on its own; true also requires the whole artifact to be `calibrated` (the strict reading
# of the calibration rule). Not part of any fit hash.
require_calibrated_artifact = false
# Development datasets, name@version (another version of the same name is not one): the
# calib-only commands read every clip of one as calib, it is never a sealed look, and
# `calibrate evaluate --score-all-clips` scores all its rows with another set's artifact.
# Several versions of one name may be declared; a B reading names the one it reads.
development_sets = ["kubric_fresh@v2-fresh", "kubric_fresh@v2-dev-b2", "kubric_synthetic@v1-precise-hdri-dev"]

# Numerical tolerance epsilon_c per check, in the unit of its default implementation unless
# tau_tolerance_units declares another (a variant's): tau = max(q, epsilon_c), where q is
# the conformal quantile. It only bites when the clean clips are exact up to rounding (the oracle);
# a perceived q is far above it. Chosen from the oracle clean clips of `local` + `levels`
# about 100x the largest clean value that is rounding noise and >= 25x below the
# smallest level-1 effect. Float32 relative noise is ~1e-7 (R5b clean 4.3e-8; R4_jump and R5a
# on contact-free scenes ~1e-13), level-1 effects are >= 0.05 (relative units), 6.4 (R4_jump),
# 1 frame (1/24 s).
[calibration.tau_tolerance]
R1 = 1e-5            # pen_over_size; clean 0..0.046 (real contact penetration, q covers it)
R2 = 1e-5            # residual_over_weight; clean exactly 0
R3a = 1e-5           # e_minus_1; clean -0.27..0.034
R3b = 1e-5           # dE_over_E; clean -0.077
R4_missing = 0.020833333333333332  # seconds: half a frame at 24 fps, one missing frame fails
R4_size = 1e-5       # rel_size_change; clean exactly 0
R4_jump = 0.01       # jump_over_noise; clean <= 2.1e-13 free flight (rounding), 0.013..0.52 at
                     # bounces (frame discretisation, q covers it), L1 teleport >= 6.4 (640x above)
R5a = 1e-5           # accel_rel_diff; clean <= 3.8e-14
R5b = 1e-5           # g_rel_error; clean 4.3e-8 (float32 rounding of g)

[calibration.profiles.fast]
subset = "local"

# Same rule, measured for the whitened R5a on the oracle clean clips of the precise calib set:
# clean <= 3.3e-15, level-1 >= 1.4e8.
[calibration.profiles.precise.tau_tolerance]
R5a = 1e-5

[calibration.profiles.precise.tau_tolerance_units]
R5a = "accel_wald_chi2_3"
