# One-look sets (ADR 0015 amendment 2 section 5). A command that computes numbers on one of them
# needs PHYSVERIFY_UNSEAL naming it and appends a ledger line before computing anything; a second
# look under another frozen state also needs PHYSVERIFY_UNSEAL_REPEAT=1. `dataset:split` seals one
# split, a bare name the whole dataset. kubric_synthetic:eval is the A8 eval split. The fresh
# Kubric renders (kubric_fresh*) and the new real controls (physics_iq_views, objectron_static)
# are their own dataset plugins, so their looks and their stage cache never mix with
# kubric_synthetic or the development real sets. h2_test keeps its own ledger
# (run_human_agreement.sh). `~` is the invoking HOME: the H200 scripts source env.sh, so the
# ledger is $PHYSVERIFY_H200_ROOT/sealed-ledger.txt.
[sealed]
ledger = "~/sealed-ledger.txt"
sets = [
    "kubric_synthetic:eval",
    "kubric_fresh",
    "kubric_fresh_ood",
    "kubric_fresh_blind",
    "physics_iq_views",
    "objectron_static",
]
