# Checks R1-R5b and verdict policy (the check suite). Every threshold is PROVISIONAL until the
# calibration chain writes data/calibration/thresholds.json, which then takes precedence.
# Deliverable 1 is a local proof of the pipeline: ~25 synthetic clips (5 families x 1 seed x
# none + 1 mid level per applicable perturbation) plus 5 Physics-IQ and 5 PISA clips.
# The full dataset and the large runs happen on the H200.
# Windows (*_s) are SECONDS of real time, turned into table rows at each clip's row rate
# (physics/row_time.py); the defaults are the former row counts at 24 fps.
# Any check id (R1, R2, R3a, R3b, R4_missing, R4_size, R4_jump, R5a, R5b) accepts a
# [checks.<id>] table overriding fields of its Params; unknown fields are a ConfigError.

# R2's friction is an interval (friction_range, default FRICTION_RANGE in
# checks/r2_static_equilibrium.py) sampled in its Monte Carlo: the static coefficients of dry
# everyday material pairs in open tables (OpenStax, College Physics 2e, table 5.1, and the others
# cited at FRICTION_RANGE), never the simulator's floor value.
[checks.R2]            # plugin defaults live in checks/r2_static_equilibrium.py; override here
mass_floor = 0.2

# The size relative to the other bodies of each frame; "self" is the v1 rule.
[checks.R4_size]
reference = "others"

# Alternative implementations (checks/variants/) are chosen per check in [check_variants],
# check id -> variant name; a check left out, or set to "default", runs its registered
# implementation. R4_size "v3": persistent change against a running median, windows in seconds,
# rows whose mask the lift saw cut by the image border left out. R4_jump "rigid2": v2 without the
# stencils where the apparent size steps, in the statistic and in its noise estimate. R4_jump
# "rigid2_dfloor": rigid2 with the depth axis of its noise no smaller than the median depth sigma
# the lift declares (blind to line-of-sight jumps below about sqrt(20) times it). The precise
# profile runs v3 and rigid2_dfloor; --set check_variants.R4_size=default (or R4_jump=default)
# restores v2, --set check_variants.R4_jump=rigid2 keeps rigid2 without the depth floor.
# R4_size "v3_window_depth" (no profile runs it): v3 on extents and their sigmas multiplied by
# runmed_W(z) / z, z the object's camera depth and W v3's window, so the per-row noise of a
# monocular depth is not read as a size change; a ground-truth lift is left as v3 sees it.
# R5a "whitened" (the precise profile runs it): each candidate scored by the Wald contrast of
# its two accelerations fitted with weights 1 / position_sigma^2, chi-square with 3 degrees of
# freedom per candidate under white noise independent per axis. Its unit is not v1's: thresholds
# come from fold calibration, and an uncalibrated run reads the a priori chi-square(3) 0.99
# quantile (about the 0.90 quantile of the maximum over a flight's ~13 cuts) and its unit from
# [verification.profiles.precise] (its tau_tolerance from [calibration.profiles.precise]);
# --set check_variants.R5a=default under precise also needs --set verification.thresholds.R5a=0.15
# --set verification.threshold_units.R5a=accel_rel_diff
# --set calibration.tau_tolerance_units.R5a=accel_rel_diff.
# R5b "unsupported" (no profile runs it): a flight counts only if on some row the body's lowest
# point rises above its scene plane by more than the scene contacts' gap gate K sigma_gap (the
# same z and sigma_gap), so a roll the contacts left unmarked is not a fall; same unit as v1.
# R5a "los_tilt" and R5b "los_ballistic" (no profile runs them; the arm k of
# scripts/h200/perception_arms.tsv does): each window is fitted by generalized least squares on the
# covariance of a monocular lift (a depth error moves the point along its ray). los_tilt scores
# the tilt of each window's acceleration away from the perceived gravity, summed over the two
# windows, about chi-square(4) [accel_tilt_chi2_4], so under precise the arm also sets its tau
# (13.28, the a priori chi-square(4) 0.99 quantile) and the units of the R5a tau and tolerance.
# los_ballistic reads g along the perceived gravity from the ballistic fit of each flight; same
# unit as v1.
# A provisional tau is read in the unit of the check's default implementation unless
# verification.threshold_units.<id> says otherwise; a tau whose unit is not the unit of the
# configured check, or a calibrated table fitted with other check parameters or variants (its
# checks_hash), stops the run with a ConfigError.
[check_variants]

[check_variants.profiles.precise]
R4_size = "v3"
R4_jump = "rigid2_dfloor"
R5a = "whitened"

[verification]
policy = "threshold"

[verification.policies.threshold]
k_sigma = 2.0
on_unknown_sigma = "abstain"

[verification.thresholds]   # provisional, check units
R1 = 0.05
R2 = 0.01
R3a = 0.05
R3b = 0.05
# R4_missing is in seconds: 2 frames at 24 fps.
R4_missing = 0.08333333333333333
R4_size = 0.10
# R4_jump v2 is in units of the track's own noise: sqrt of the chi-square(3) quantile at
# 1 - 0.05 / 20 (Bonferroni over about 20 stencils), fixed a priori, not tuned on data. Every
# magnitude is restated at the 21 stencils of a 24-row clip (same family-wise tail), so the
# threshold holds for clips of any length.
R4_jump = 3.78
R5a = 0.15
R5b = 0.15

[verification.profiles.precise.thresholds]
R5a = 11.34

[verification.profiles.precise.threshold_units]
R5a = "accel_wald_chi2_3"

[verification.specificity]
abs_tol = 1e-3
rel_tol = 0.02
null_tol = 1e-3
# Physical couplings: reported as "expected coupling", never failed.
# r5a_gravity_switch -> R5b: one parabola over a flight whose g rotates by theta mid-flight fits
#   |a| ~ g cos(theta / 2) (0.4 % on the local f1 clip, far below the R5b threshold).
# r5a_gravity_switch -> R4_jump: the switch is a jump of the acceleration; the third difference
#   peaks at most |delta g| dt^2, spread over the stencils around the switch; R4_jump v2 divides it
#   by sqrt(20) times the track's noise (one pixel on the oracle), so it is a coupling in units
#   of the noise, not of the body (v1: 0.0135 body lengths on the local f1 clip).
couplings = [["r5a_gravity_switch", "R5b"], ["r5a_gravity_switch", "R4_jump"]]
