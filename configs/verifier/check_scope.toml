# Checks the consumers leave out (verification/scope.py). One list for the human-agreement study
# and the generator comparison (finetune scorer); each consumer says whether it also leaves out
# the time-dependent ones ([agreement].exclude_time_dependent,
# [finetune].exclude_time_dependent). Ids are validated
# against the check registry: an unknown id is a configuration error.
[check_scope]
# Manual only, with manual_deviation; the exclusion rules write the record.
exclude_checks = []
time_dependent_checks = ["R5b", "R4_jump", "R4_missing"]   # magnitudes depend on the fps
kept_when_excluding_time = ["R4_missing"]   # time-dependent, still a fine-tune target
decision_record = "exclusions.json"          # `exclusions decide` writes it
require_decision_record = false              # true before freezing the human-agreement study
