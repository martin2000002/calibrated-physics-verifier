# Seed owned by cycle A5 (ADR 0003, section 5): stage -> provider plan and sampling, as data.
# The base tables are the `fast` profile.

[extraction.plan]
detect = "grounding_dino_tiny"
track = "edgetam"
depth = "vda_small"
camera = "assumed_fov"
lift = "backproject"
scale = "size_prior"
kinematics = "savgol"
contacts = "proximity"

[extraction.sampling]
max_side = 640

# The sealed sets of the freeze sample like their source dataset (test_target_fps_follows_source).
[extraction.sampling.target_fps]
kubric_synthetic = 24
physics_iq = 16
pisa_real = 60
kubric_fresh = 24
kubric_fresh_ood = 24
kubric_fresh_blind = 24
physics_iq_views = 16
objectron_static = 16

# Local depth resolution: 518 and 392 were OOM-killed on the 7.6 GB laptop (ADR 0007, section 13.3).
[extraction.providers.depth.vda_small]
input_size = 280

# One query per object with the base detector: recall +0.16 on held-out v1-precise scenes (ADR 0014).
[extraction.profiles.precise.plan]
detect = "grounding_dino_base"
track = "sam2_1_hiera_tiny"
# it2 gate commit (Knowledge/handoffs/mejora-percepcion/p0-it2.md): G-conv and G-ood pass, G-focal keeps
# the assumed focal (OOD p90 no-harm fails), so GeoCalib gives gravity only.
camera = "geocalib"
# it3 gate commit (Knowledge/handoffs/mejora-percepcion/p0-it3.md): G-depth passes and G-contacts fails
# on (c), so only the depth is adopted; contacts stay proximity. it4 (judgement J13 of plan-it4): the
# base chain chosen by amendment 2 section 4 is it2-CPU, so precise keeps vda_small.
depth = "vda_small"

[extraction.profiles.precise.providers.camera.geocalib]
focal = "assumed"
n_frames = 8

[extraction.profiles.precise.sampling]
max_side = 960

[extraction.profiles.precise.sampling.target_fps]
physics_iq = 30
pisa_real = 120
physics_iq_views = 30
objectron_static = 30

[extraction.profiles.precise.providers.depth.vda_small]
input_size = 518

# The same input size for depth/vda_large (it3 G-depth compares the two at 518).
[extraction.profiles.precise.providers.depth.vda_large]
input_size = 518
