    "ball-and-block-fall",
    "ball-hits-duck",
    "ball-hits-nothing",
    "ball-in-basket",
    "ball-ramp",
    "ball-rolls-off",
    "ball-rolls-on-glass",
    "ball-train",
    "balls-collide",
    "block-domino",
    "dominos-with-space",
    "double-cradle",
    "duck-and-dominos",
    "duck-falls-in-box",
    "marble-run-x",
    "marble-run-y",
    "mirror-ball-fall",
    "roll-behind-box",
    "roll-front-box",
    "roll-in-box",
    "single-cradle",
    "solid-ball-peakaboo",
    "two-balls-pass",
    "unstable-block-stack",
]
full_static = ["duck-static", "stable-blocks", "glass-stays-same"]
