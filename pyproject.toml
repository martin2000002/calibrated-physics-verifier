[project]
name = "physverify"
version = "0.1.0"
description = "Calibrated physics verifier for generated video of rigid bodies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Martin Montero" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.8",
    "typer>=0.12",
    "opencv-python-headless>=4.10",
    "psutil>=6",
]

[project.scripts]
physverify = "physverify.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physverify"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "mypy>=1.13"]
cpu = ["torch>=2.8", "torchvision>=0.23"]
cu128 = ["torch>=2.8", "torchvision>=0.23"]
perception = [
    "transformers>=4.57,<6",
    "accelerate",
    "timm",
    "huggingface-hub",
    "safetensors",
    "einops",
    "easydict",
    "imageio",
    "matplotlib",
    "tqdm",
]
analysis = ["pandas>=2.2", "matplotlib", "scikit-learn>=1.5"]
data = ["remotezip", "huggingface-hub"]

[tool.uv]
default-groups = ["dev", "cpu", "perception", "analysis", "data"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.per-file-target-version]
"src/physverify/schema/**" = "py39"
"src/physverify/kubric_worker/**" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["physverify"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/physverify"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "transformers.*", "kubric.*", "bpy.*", "pybullet.*", "scipy.*", "psutil.*"]
ignore_missing_imports = true

# Cycle-owned implementation modules are type-checked but not held to strict mode.
[[tool.mypy.overrides]]
module = [
    "physverify.synth.*",
    "physverify.extraction.*",
    "physverify.datasets.*",
    "physverify.checks.*",
    "physverify.verification.*",
    "physverify.diagnosis.*",
    "physverify.timing.*",
    "physverify.kubric_worker.*",
    "physverify.cli.commands.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# Every frozen protocol module and frozen CLI command stays strict.
[[tool.mypy.overrides]]
module = [
    "physverify.synth.families._base",
    "physverify.synth.perturbations._base",
    "physverify.extraction._base",
    "physverify.datasets._base",
    "physverify.checks._base",
    "physverify.verification._base",
    "physverify.diagnosis._base",
    "physverify.timing._base",
    "physverify.kubric_worker.__main__",
    "physverify.kubric_worker.tasks.ping",
    "physverify.cli.commands.doctor",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not heavy and not docker and not network and not gpu'"
testpaths = ["tests"]
pythonpath = ["tests/fixtures", "tests/fixtures/plugins"]
markers = [
    "heavy: real model inference or Kubric rendering (run under the heavy lock)",
    "docker: needs the pinned Kubric image",
    "network: downloads from the internet",
    "gpu: needs CUDA",
]
